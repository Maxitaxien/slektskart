services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: slektskart_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d slektskart_test"]
      interval: 2s
      timeout: 3s
      retries: 10
